name: FreshNest checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm test
      - run: npm run build
      - run: npm --prefix backend test
      - run: npm run images:check
